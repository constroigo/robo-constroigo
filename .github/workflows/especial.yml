name: Post especial

on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: "Arquivo em especiais/ (ex.: especiais/2026-11-nova-fase.json)"
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: robo-constroigo
  cancel-in-progress: false

jobs:
  especial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Gerar a arte
        id: prep
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -m robo.especial "${{ inputs.arquivo }}"
      - name: Salvar no repositório
        run: |
          git config user.name "robo-constroigo"
          git config user.email "robo@users.noreply.github.com"
          git add posts
          git commit -m "Post especial ${{ steps.prep.outputs.pasta }}"
          git pull --rebase && git push
      - name: Pedir aprovação
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          sleep 20
          python -m robo.aprovacao "${{ steps.prep.outputs.pasta }}"
