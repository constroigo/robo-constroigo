name: Stories de frases

on:
  schedule:
    - cron: "13 12 * * *"   # 09:13 BRT
    - cron: "41 20 * * *"   # 17:41 BRT
  workflow_dispatch:
    inputs:
      turno:
        description: "0 = manhã, 1 = tarde"
        default: "0"

permissions:
  contents: write
  issues: write

concurrency:
  group: robo-constroigo
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Gerar a arte
        id: prep
        run: |
          T="${{ inputs.turno }}"
          if [ ! -f data/frases-ativo ]; then echo "Stories de frases desligados."; exit 0; fi
          if [ -z "$T" ]; then [ "$(date -u +%H)" -lt 18 ] && T=0 || T=1; fi
          python -m robo.frases "$T"
      - name: Salvar no repositório
        if: steps.prep.outputs.arquivo != ''
        run: |
          git config user.name "robo-constroigo"
          git config user.email "robo@users.noreply.github.com"
          git add posts/stories
          git commit -m "Story de frase" || true
          git pull --rebase && git push
      - name: Publicar o story (ou abrir pacote manual)
        if: steps.prep.outputs.arquivo != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          ARQ='${{ steps.prep.outputs.arquivo }}'
          if [ -f data/modo-manual ]; then python -m robo.aprovacao --story "$ARQ"; exit 0; fi
          sleep 20
          python -c "
          from robo import instagram
          from robo.aprovacao import url_publica
          import os
          pasta, nome = os.path.split('$ARQ')
          print(instagram.publicar_story(url_publica(pasta, nome)))
          "
