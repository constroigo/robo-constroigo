{% extends "_base.html" %}
{% block meio %}
  {% if destaque and e.layout == 'caixa' %}
    <span class="caixa" style="font-size: {{ (tam_destaque * 0.8)|int }}px">{{ destaque }}</span>
  {% elif destaque %}
    <span class="destaque" style="font-size: {{ tam_destaque }}px">{{ destaque }}</span>
  {% endif %}
  <h1 style="font-size: {{ tam_manchete }}px">{{ manchete }}</h1>
  <p class="resumo">{{ resumo }}</p>
{% endblock %}
